<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Harian Saya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Catatan Harian</h1>
        <label for="tanggal">Tanggal:</label>
        <input type="date" id="tanggal">
        
        <label for="sleepTime">Jam Tidur:</label>
        <input type="time" id="sleepTime">
        
        <label for="wakeTime">Jam Bangun:</label>
        <input type="time" id="wakeTime">
        
        <label for="foodLog">Menu Makan:</label>
        <textarea id="foodLog" placeholder="Apa yang dimakan?"></textarea>
        
        <label for="dailyNotes">Catatan Menarik:</label>
        <textarea id="dailyNotes" placeholder="Hal menarik hari ini?"></textarea>
        
        <button onclick="simpanCatatan()">Simpan Catatan</button>
        <button onclick="downloadExcel()">Download ke Excel</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
